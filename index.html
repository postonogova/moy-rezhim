<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мой режим</title>
<meta name="theme-color" content="#0f1317">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0f1317; --surface:#171d23; --raised:#1f272f; --fg:#eef2f5; --muted:#8e9aa6; --line:#29323b;
  --lamp:#f2b45a; --lamp-soft:#3a2d18; --ink:#1a1206;
  --sky:#7fa7d9; --sky-soft:#1c2a3a; --ok:#6fcf97; --bad:#e78a82;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"Roboto Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-weight:800;font-size:1.55rem;margin:0;letter-spacing:-.01em}
h2{font-weight:700;font-size:.78rem;margin:0;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav{display:flex;gap:6px}
.icon{font:inherit;background:var(--surface);border:1px solid var(--line);color:var(--fg);width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:1.2rem}
.icon:disabled{opacity:.35;cursor:default}
.date{color:var(--muted);margin-top:4px;font-size:.9rem}
.section{display:flex;flex-direction:column;gap:10px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:58px}
.row:last-child{border-bottom:none}
.row .name{flex:1;min-width:0}
.row .name small{display:block;color:var(--muted);font-size:.78rem}
.tick{font:inherit;flex:0 0 auto;width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--raised);color:transparent;cursor:pointer;font-size:1.2rem;font-weight:700}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#0b1a12}
.stamp{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--raised);color:var(--fg);border-radius:10px;padding:10px 12px;cursor:pointer;white-space:nowrap}
input[type=time]{font-family:var(--f-mono);font-size:1rem;color:var(--fg);background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:8px;width:7.4rem}
input[type=text]{font:inherit;color:var(--fg);background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
button:focus-visible,input:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.night{background:linear-gradient(180deg,var(--sky-soft),var(--surface));border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.mirt{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.big{font:inherit;font-weight:700;font-size:1.05rem;border:none;border-radius:14px;padding:16px 18px;cursor:pointer;background:var(--lamp);color:var(--ink);flex:1 1 220px;text-align:left}
.big[aria-pressed="true"]{background:var(--lamp-soft);color:var(--lamp);box-shadow:inset 0 0 0 1.5px var(--lamp)}
.big small{display:block;font-size:.8rem;font-weight:500;opacity:.85;margin-top:2px}
.timeedit{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted)}
.streak{font-size:.86rem;color:var(--muted)}
.streak b{color:var(--lamp);font-family:var(--f-mono)}
.sleeprow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sleepcell{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.sleepcell span{font-size:.8rem;color:var(--muted)}
.sleepcell .pair{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sleepcell input[type=time]{width:100%;flex:1 1 90px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{font:inherit;font-family:var(--f-mono);font-weight:700;font-size:1.05rem;padding:12px 0;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--fg);cursor:pointer}
.scale button[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:#0c1622}
.scalehint{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px 8px;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:320px;height:auto}
.foot{font-size:.78rem;color:var(--muted);margin:0}
.saved{font-size:.78rem;color:var(--muted);min-height:1.1em}
.backup{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.warn{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1 id="title">Сегодня</h1>
      <div class="date" id="date"></div>
    </div>
    <div class="nav">
      <button class="icon" id="prev" type="button" aria-label="Предыдущий день">‹</button>
      <button class="icon" id="next" type="button" aria-label="Следующий день">›</button>
    </div>
  </div>

  <section class="section">
    <h2>Утро</h2>
    <div class="list" id="morning"></div>
  </section>

  <section class="section">
    <h2>День</h2>
    <div class="list" id="daytime"></div>
  </section>

  <section class="night" aria-label="Вечер">
    <h2>Вечер</h2>
    <div class="mirt">
      <button type="button" class="big" id="mirtBtn" aria-pressed="false">Выпил миртазапин<small>Нажми, и время запишется само</small></button>
      <label class="timeedit" for="mirtTime">Время<input type="time" id="mirtTime"></label>
    </div>
    <div class="streak" id="streak"></div>
    <div class="list" id="evening"></div>
  </section>

  <section class="section">
    <h2>Сон</h2>
    <div class="sleeprow">
      <div class="sleepcell">
        <span>Лёг спать</span>
        <div class="pair"><input type="time" id="bed" aria-label="Время, когда лёг"><button type="button" class="stamp" id="bedNow">Сейчас</button></div>
      </div>
      <div class="sleepcell">
        <span>Проснулся</span>
        <div class="pair"><input type="time" id="up" aria-label="Время, когда проснулся"><button type="button" class="stamp" id="upNow">Сейчас</button></div>
      </div>
    </div>
    <p class="foot">«Лёг» после полуночи засчитывается в предыдущий вечер.</p>
  </section>

  <section class="section">
    <h2>Как день в целом</h2>
    <div class="scale" id="mood"></div>
    <div class="scalehint"><span>совсем никак</span><span>отлично</span></div>
    <label class="foot" for="good">Что было хорошего сегодня (можно пропустить)</label>
    <input type="text" id="good" maxlength="200" placeholder="Например: прошёл уровень, вкусно поел, посмеялся с друзьями">
  </section>

  <section class="section">
    <h2>Сон за неделю</h2>
    <div class="chart" id="chart"></div>
  </section>

  <div class="saved" id="saved" role="status"></div>

  <section class="backup" aria-label="Копии">
    <h2>Копии данных</h2>
    <p class="foot">Все записи хранятся только на этом телефоне. Раз в неделю сохраняй копию, чтобы ничего не потерять.</p>
    <div class="btns">
      <button type="button" class="stamp" id="csvBtn">Таблица для врача</button>
      <button type="button" class="stamp" id="jsonBtn">Резервная копия</button>
      <button type="button" class="stamp" id="restoreBtn">Восстановить из копии</button>
      <input type="file" id="restoreFile" accept=".json,application/json" hidden>
    </div>
    <p class="foot" id="backupMsg" role="status"></p>
  </section>
</div>

<script>
(function(){
const KEY="moy-rezhim-v1";
const MORNING=[{k:"morning",n:"Нексиум + Необутин",s:"натощак, сразу после подъёма"},{k:"elkar1",n:"Элькар",s:"с завтраком"},{k:"selank",n:"Селанк",s:"капли"},{k:"pepsan",n:"Пепсан-Р",s:"через час после завтрака"}];
const DAYTIME=[{k:"neob2",n:"Необутин",s:"перед обедом или ужином"},{k:"elkar2",n:"Элькар",s:"с едой, до 17:00"},{k:"pepsan2",n:"Пепсан-Р",s:"через час после обеда"}];
const EVENING=[{k:"pepsan3",n:"Пепсан-Р",s:"через час после ужина"}];
const ALLMEDS=[...MORNING,...DAYTIME,...EVENING];
const MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const WDL=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
const WD=["вс","пн","вт","ср","чт","пт","сб"];
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const shift=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const nowHM=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
const logicalToday=()=>{const d=new Date();if(d.getHours()<5)d.setDate(d.getDate()-1);return iso(d)};
const $=id=>document.getElementById(id);

let days={}; let selected=logicalToday();
const rec=s=>days[s]||(days[s]={date:s,meds:{}});
const hasData=r=>r&&(r.bed||r.up||r.mood||r.good||r.mirtTime||Object.values(r.meds||{}).some(Boolean));

/* storage: only this phone */
function load(){try{const r=localStorage.getItem(KEY);if(r)days=JSON.parse(r)||{}}catch(e){}}
let t=null;
function save(){
  clearTimeout(t);
  t=setTimeout(()=>{
    try{localStorage.setItem(KEY,JSON.stringify(days));$("saved").textContent="Сохранено на телефоне"}
    catch(e){$("saved").textContent="Не удалось сохранить. Проверь, не заполнена ли память телефона."}
  },250);
}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}

/* build */
function rows(list){return list.map(m=>`<div class="row"><div class="name">${m.n}<small>${m.s}</small></div><button type="button" class="tick" data-med="${m.k}" aria-pressed="false" aria-label="${m.n}">✓</button></div>`).join("")}
$("morning").innerHTML=`<div class="row"><div class="name">Проснулся и встал<small>время можно поправить ниже</small></div><button type="button" class="stamp" id="upNow2">Встал</button></div>`+rows(MORNING);
$("daytime").innerHTML=rows(DAYTIME);
$("evening").innerHTML=rows(EVENING);
$("mood").innerHTML=[1,2,3,4,5].map(n=>`<button type="button" data-mood="${n}" aria-pressed="false">${n}</button>`).join("");

/* render */
function render(){
  const r=days[selected]||{meds:{}};
  const tday=logicalToday();
  $("title").textContent=selected===tday?"Сегодня":selected===shift(tday,-1)?"Вчера":"День";
  const d=parse(selected);
  $("date").textContent=d.getDate()+" "+MON[d.getMonth()]+", "+WDL[d.getDay()];
  $("next").disabled=selected>=tday;
  document.querySelectorAll("[data-med]").forEach(b=>b.setAttribute("aria-pressed",!!(r.meds&&r.meds[b.dataset.med])));
  const mt=r.meds&&r.meds.mirt;
  $("mirtBtn").setAttribute("aria-pressed",!!mt);
  $("mirtBtn").innerHTML=mt?`Миртазапин выпит<small>Нажми ещё раз, если отметил по ошибке</small>`:`Выпил миртазапин<small>Нажми, и время запишется само</small>`;
  $("mirtTime").value=r.mirtTime||"";
  $("bed").value=r.bed||"";
  $("up").value=r.up||"";
  $("upNow2").textContent=r.up?("Встал в "+r.up):"Встал";
  document.querySelectorAll("[data-mood]").forEach(b=>b.setAttribute("aria-pressed",String(r.mood)===b.dataset.mood));
  if(document.activeElement!==$("good"))$("good").value=r.good||"";
  renderStreak();renderChart();
}
function renderStreak(){
  const tday=logicalToday();let n=0,ontime=0;
  for(let i=0;i<7;i++){const r=days[shift(tday,-i)];if(r&&r.meds&&r.meds.mirt){n++;if(r.mirtTime&&r.mirtTime>="20:30"&&r.mirtTime<="21:30")ontime++}}
  $("streak").innerHTML=n?`За последние 7 дней: <b>${n}</b> из 7, вовремя (около 21:00) — <b>${ontime}</b>`:"Принимается в 21:00. После него лучше уже готовиться ко сну.";
}
const toMin=hm=>{if(!hm)return null;const[h,m]=hm.split(":").map(Number);return h*60+m};
const pos=m=>m>=1200?m-1200:m+240;
function renderChart(){
  const tday=logicalToday();const nights=[];
  for(let i=6;i>=0;i--){const s=shift(tday,-i-1);nights.push({s,bed:days[s]&&days[s].bed,up:days[shift(s,1)]&&days[shift(s,1)].up})}
  const W=520,L=58,R=12,T=22,RH=30,H=T+RH*7+8,span=1080,x=m=>L+(W-L-R)*m/span;
  const ticks=[["20",0],["00",240],["04",480],["08",720],["12",960]];
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Сон за последние 7 ночей">`;
  ticks.forEach(([l,m])=>{g+=`<line x1="${x(m)}" x2="${x(m)}" y1="${T-6}" y2="${H-6}" stroke="#29323b" stroke-width="1"/><text x="${x(m)}" y="${T-10}" fill="#8e9aa6" font-size="11" font-family="monospace" text-anchor="middle">${l}:00</text>`});
  g+=`<rect x="${x(180)}" y="${T-4}" width="${x(720)-x(180)}" height="${RH*7}" fill="#7fa7d9" opacity=".07"/>`;
  nights.forEach((n,i)=>{
    const y=T+i*RH,d=parse(n.s);
    g+=`<text x="4" y="${y+RH/2+4}" fill="#8e9aa6" font-size="11" font-family="sans-serif">${WD[d.getDay()]} ${d.getDate()}</text>`;
    const b=toMin(n.bed),u=toMin(n.up);
    if(b!=null&&u!=null){let a=pos(b),z=pos(u);if(z<=a)z=a;const dur=z-a;
      g+=`<rect x="${x(a)}" y="${y+7}" width="${Math.max(3,x(z)-x(a))}" height="${RH-14}" rx="5" fill="#7fa7d9"/>`;
      const lab=Math.floor(dur/60)+"ч"+(dur%60?" "+pad(dur%60):"");
      const near=x(z)+6>W-40,lx=near?x(a)-6:x(z)+6;
      g+=`<text x="${lx}" y="${y+RH/2+4}" fill="#eef2f5" font-size="11" font-family="monospace" text-anchor="${near?"end":"start"}">${lab}</text>`}
    else if(b!=null){g+=`<circle cx="${x(pos(b))}" cy="${y+RH/2}" r="5" fill="#7fa7d9"/>`}
    else if(u!=null){g+=`<circle cx="${x(pos(u))}" cy="${y+RH/2}" r="5" fill="none" stroke="#7fa7d9" stroke-width="2"/>`}
    else{g+=`<line x1="${x(0)}" x2="${x(span)}" y1="${y+RH/2}" y2="${y+RH/2}" stroke="#29323b" stroke-dasharray="2 5"/>`}
  });
  g+=`</svg>`;
  $("chart").innerHTML=g+`<p class="foot" style="padding:6px 4px 0">Подсвечено окно 23:00–08:00. Полоса появится, когда отмечены и «лёг», и «проснулся».</p>`;
}

/* events */
document.addEventListener("click",e=>{
  const med=e.target.closest("[data-med]");
  if(med){const r=rec(selected);r.meds[med.dataset.med]=!r.meds[med.dataset.med];render();save();return}
  const mo=e.target.closest("[data-mood]");
  if(mo){const r=rec(selected);const v=Number(mo.dataset.mood);r.mood=r.mood===v?null:v;render();save();return}
});
$("mirtBtn").addEventListener("click",()=>{const r=rec(selected);if(r.meds.mirt){r.meds.mirt=false;r.mirtTime=""}else{r.meds.mirt=true;if(!r.mirtTime)r.mirtTime=selected===logicalToday()?nowHM():"21:00"}render();save()});
$("mirtTime").addEventListener("change",()=>{const r=rec(selected);r.mirtTime=$("mirtTime").value;if(r.mirtTime)r.meds.mirt=true;render();save()});
function bedNow(){const d=new Date();const s=d.getHours()<12?shift(iso(d),-1):iso(d);rec(s).bed=nowHM();selected=s;render();save()}
function upNow(){const s=iso(new Date());rec(s).up=nowHM();selected=s;render();save()}
$("bedNow").addEventListener("click",bedNow);
$("upNow").addEventListener("click",upNow);
$("upNow2").addEventListener("click",upNow);
$("bed").addEventListener("change",()=>{rec(selected).bed=$("bed").value;render();save()});
$("up").addEventListener("change",()=>{rec(selected).up=$("up").value;render();save()});
$("good").addEventListener("input",()=>{rec(selected).good=$("good").value;save()});
$("prev").addEventListener("click",()=>{selected=shift(selected,-1);render()});
$("next").addEventListener("click",()=>{if(selected<logicalToday()){selected=shift(selected,1);render()}});

/* backups */
function download(name,text,type){
  const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function csvCell(v){v=v==null?"":String(v);return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
$("csvBtn").addEventListener("click",()=>{
  const list=Object.values(days).filter(hasData).sort((a,b)=>a.date.localeCompare(b.date));
  if(!list.length){$("backupMsg").textContent="Пока нечего сохранять: нет ни одной записи.";return}
  const head=["Дата","День недели","Проснулся","Лёг (вечером этого дня)","Нексиум + Необутин","Элькар 1","Селанк","Необутин 2","Элькар 2","Пепсан-Р (завтрак)","Пепсан-Р (обед)","Пепсан-Р (ужин)","Миртазапин","Время миртазапина","Оценка дня (1–5)","Что было хорошего"];
  const order=["morning","elkar1","selank","neob2","elkar2","pepsan","pepsan2","pepsan3"];
  const lines=[head.map(csvCell).join(";")];
  list.forEach(r=>{const d=parse(r.date);lines.push([pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear(),WD[d.getDay()],r.up||"",r.bed||"",...order.map(k=>r.meds&&r.meds[k]?"да":""),r.meds&&r.meds.mirt?"да":"",r.mirtTime||"",r.mood||"",r.good||""].map(csvCell).join(";"))});
  download("мой-режим-"+logicalToday()+".csv","﻿"+lines.join("\r\n"),"text/csv;charset=utf-8");
  $("backupMsg").textContent="Таблица сохранена в «Загрузки».";
});
$("jsonBtn").addEventListener("click",()=>{
  if(!Object.values(days).some(hasData)){$("backupMsg").textContent="Пока нечего сохранять: нет ни одной записи.";return}
  download("мой-режим-копия-"+logicalToday()+".json",JSON.stringify({app:"moy-rezhim",version:1,saved:new Date().toISOString(),days},null,1),"application/json");
  $("backupMsg").textContent="Резервная копия сохранена в «Загрузки». Её можно переслать маме или себе в мессенджер.";
});
$("restoreBtn").addEventListener("click",()=>$("restoreFile").click());
$("restoreFile").addEventListener("change",()=>{
  const f=$("restoreFile").files[0];if(!f)return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const data=JSON.parse(fr.result);
      if(!data||data.app!=="moy-rezhim"||typeof data.days!=="object")throw 0;
      let added=0;
      Object.entries(data.days).forEach(([k,v])=>{if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&v&&typeof v==="object"){if(!hasData(days[k])){days[k]=Object.assign({date:k,meds:{}},v);added++}}});
      save();render();
      $("backupMsg").textContent=added?`Восстановлено дней: ${added}. Уже заполненные дни не тронуты.`:"Все дни из копии уже есть на телефоне, ничего не изменилось.";
    }catch(e){$("backupMsg").innerHTML='<span class="warn">Это не похоже на резервную копию «Моего режима». Выбери файл, который начинается с «мой-режим-копия».</span>'}
    $("restoreFile").value="";
  };
  fr.readAsText(f);
});

load();render();

if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
})();
</script>
</body>
</html>
